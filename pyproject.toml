[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biome-rag"
version = "0.1.0"
description = "Phase 1 RAG ingestion and chunking pipeline"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
